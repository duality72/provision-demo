name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/app/**'
      - 'terraform/github/**'
  # Manual trigger, so the app stack can be reinstated after a teardown without
  # inventing a commit to push. This is the restore path in
  # docs/teardown-restore.md.
  workflow_dispatch:

# Serialise runs against the shared Terraform state. Without this, an
# overlapping or superseded run can be killed mid-plan and orphan its
# DynamoDB lock, which blocks the stack until someone force-unlocks it.
concurrency:
  group: terraform-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    # Only meaningful for a push: a manual run has no diff to filter on, so
    # apply-app runs unconditionally in that case (see its `if` below).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app: ${{ steps.filter.outputs.app }}
      github: ${{ steps.filter.outputs.github }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'terraform/app/**'
            github:
              - 'terraform/github/**'

  apply-app:
    name: apply-app
    needs: detect-changes
    # DISABLED — the app stack is intentionally torn down and is staying down.
    # `terraform/app` state holds 0 resources, so an apply here would not update
    # a running stack, it would rebuild it from scratch: new Function URL, new
    # Cognito pool, no users. See docs/teardown-restore.md.
    #
    # This is belt and braces. The whole workflow is *also* disabled at the
    # GitHub level (`disabled_manually`). Either guard alone would stop an
    # apply; the workflow-level disable additionally covers `workflow_dispatch`
    # and any job added here later, while this `if` keeps the standdown visible
    # in the tree rather than only in the Actions UI. Reinstating needs both:
    #
    #   gh workflow enable 251994440 --repo duality72/provision-demo
    #   # ...then restore the commented-out condition below.
    #
    # always() is required because detect-changes is skipped on a manual run,
    # and a skipped dependency would otherwise skip this job too.
    # if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.app == 'true')
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Lambda layer
        working-directory: terraform/app/lambda
        run: bash build-layer.sh

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/app
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform/app
        run: terraform apply -input=false -var-file=ci.tfvars -auto-approve -no-color
        env:
          TF_VAR_github_app_id: ${{ secrets.APP_ID }}
          TF_VAR_github_app_installation_id: ${{ secrets.APP_INSTALLATION_ID }}

      - name: Install SOPS
        run: |
          set -euo pipefail
          # Pinned digest, not just a pinned version: this binary decrypts
          # production secrets moments later and is installed with sudo, so a
          # substituted artifact would be a privileged-context compromise.
          # sha256sum -c fails non-zero on mismatch, aborting under set -e.
          SOPS_VERSION=3.11.0
          SOPS_SHA256=775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef
          curl -sfLO "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops-v${SOPS_VERSION}.linux.amd64" | sha256sum -c -
          chmod +x "sops-v${SOPS_VERSION}.linux.amd64"
          sudo mv "sops-v${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops

      - name: Populate secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Decrypted plaintext stays in this step only; never written to disk
          # and never echoed. put-secret-value reads from stdin via file:///dev/stdin.
          plain=$(sops -d terraform/app/secrets.enc.json)

          for pair in \
            "github_app_private_key_base64:provision-demo/github-app-private-key" \
            "anthropic_api_key:provision-demo/anthropic-api-key"; do
            field="${pair%%:*}"; secret_id="${pair#*:}"
            printf '%s' "$plain" | jq -ej ".${field} // error(\"missing field: ${field}\")" \
              | aws secretsmanager put-secret-value \
                  --secret-id "$secret_id" \
                  --secret-string file:///dev/stdin \
                  --region us-east-1 >/dev/null
            echo "populated $secret_id"
          done

          # The platform repo's AGE_SECRET_KEY only needs updating when the age
          # keypair is rotated, which is rare. Pushing it needs GH_TOKEN, set
          # from the GH_PAT secret above, which is absent from this repo — so
          # skip loudly rather than failing a deploy whose real work (the two
          # Secrets Manager values above) succeeded.
          if [ -n "${GH_TOKEN:-}" ]; then
            printf '%s' "$plain" | jq -ej '.age_secret_key // error("missing field: age_secret_key")' \
              | gh secret set AGE_SECRET_KEY --repo duality72/provision-demo-platform
            echo "set AGE_SECRET_KEY on the platform repo"
          else
            echo "NOTE: GH_PAT absent, so AGE_SECRET_KEY was not pushed to the platform repo."
            echo "      That is only a problem if the age keypair was just rotated. If so, run:"
            echo "      sops -d terraform/app/secrets.enc.json \\"
            echo "        | jq -ej '.age_secret_key // error(\"missing field: age_secret_key\")' \\"
            echo "        | gh secret set AGE_SECRET_KEY --repo duality72/provision-demo-platform"
          fi

  apply-github:
    name: apply-github
    needs: detect-changes
    # DISABLED — the terraform/github stack has drifted and is unsafe to apply.
    # A plan against it currently proposes to:
    #   1. Blank SOPS_KMS_ARN and AWS_ROLE_ARN on the platform repo. Those
    #      secrets no longer exist on this repo, so TF_VAR_sops_kms_arn and
    #      TF_VAR_aws_role_arn resolve to empty strings. The platform repo uses
    #      both to assume AWS and SOPS-encrypt connector secrets.
    #   2. Recreate github_branch_protection on both repos. They have since
    #      moved to rulesets, so Terraform reads the legacy protection as
    #      deleted and would layer it back on top of the rulesets.
    # It also cannot authenticate at all: GH_PAT is absent, which is why this
    # stack has been unappliable since March.
    #
    # Re-enable by restoring the three missing secrets and reconciling
    # github_branch_protection against the rulesets — most likely by deleting
    # those resources, since rulesets have replaced them. plan-github is left
    # running deliberately, so the drift stays visible on every PR.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/github
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform/github
        run: terraform apply -input=false -var-file=ci.tfvars -auto-approve -no-color
        env:
          TF_VAR_github_token: ${{ secrets.GH_PAT }}
          TF_VAR_sops_kms_arn: ${{ secrets.SOPS_KMS_ARN }}
          TF_VAR_aws_role_arn: ${{ secrets.PLATFORM_AWS_ROLE_ARN }}
          TF_VAR_demo_ci_aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
