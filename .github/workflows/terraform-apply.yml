name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/app/**'
      - 'terraform/github/**'

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      github: ${{ steps.filter.outputs.github }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'terraform/app/**'
            github:
              - 'terraform/github/**'

  apply-app:
    name: apply-app
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Lambda layer
        working-directory: terraform/app/lambda
        run: bash build-layer.sh

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/app
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/app
        run: terraform apply -var-file=ci.tfvars -auto-approve -no-color
        env:
          TF_VAR_github_app_id: ${{ secrets.APP_ID }}
          TF_VAR_github_app_installation_id: ${{ secrets.APP_INSTALLATION_ID }}

      - name: Install SOPS
        run: |
          set -euo pipefail
          # Pinned digest, not just a pinned version: this binary decrypts
          # production secrets moments later and is installed with sudo, so a
          # substituted artifact would be a privileged-context compromise.
          # sha256sum -c fails non-zero on mismatch, aborting under set -e.
          SOPS_VERSION=3.11.0
          SOPS_SHA256=775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef
          curl -sfLO "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops-v${SOPS_VERSION}.linux.amd64" | sha256sum -c -
          chmod +x "sops-v${SOPS_VERSION}.linux.amd64"
          sudo mv "sops-v${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops

      - name: Populate secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Decrypted plaintext stays in this step only; never written to disk
          # and never echoed. put-secret-value reads from stdin via file:///dev/stdin.
          plain=$(sops -d terraform/app/secrets.enc.json)

          for pair in \
            "github_app_private_key_base64:provision-demo/github-app-private-key" \
            "anthropic_api_key:provision-demo/anthropic-api-key"; do
            field="${pair%%:*}"; secret_id="${pair#*:}"
            printf '%s' "$plain" | jq -ej ".${field} // error(\"missing field: ${field}\")" \
              | aws secretsmanager put-secret-value \
                  --secret-id "$secret_id" \
                  --secret-string file:///dev/stdin \
                  --region us-east-1 >/dev/null
            echo "populated $secret_id"
          done

          printf '%s' "$plain" | jq -ej '.age_secret_key // error("missing field: age_secret_key")' \
            | gh secret set AGE_SECRET_KEY --repo duality72/provision-demo-platform
          echo "set AGE_SECRET_KEY on the platform repo"

  apply-github:
    name: apply-github
    needs: detect-changes
    if: needs.detect-changes.outputs.github == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/github
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/github
        run: terraform apply -var-file=ci.tfvars -auto-approve -no-color
        env:
          TF_VAR_github_token: ${{ secrets.GH_PAT }}
          TF_VAR_sops_kms_arn: ${{ secrets.SOPS_KMS_ARN }}
          TF_VAR_aws_role_arn: ${{ secrets.PLATFORM_AWS_ROLE_ARN }}
          TF_VAR_demo_ci_aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
